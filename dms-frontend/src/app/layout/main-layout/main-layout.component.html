<div class="layout-wrapper">

            <span class="text-2xl font-bold text-primary mr-5" style="letter-spacing: 0.5px;">DMS 系統</span>
            <nav class="flex gap-4">
                <a routerLink="/documents" routerLinkActive="font-bold text-primary" [routerLinkActiveOptions]="{exact: true}" class="text-700 hover:text-primary transition-colors transition-duration-200 cursor-pointer no-underline">文件維護</a>
                <a routerLink="/upload" routerLinkActive="font-bold text-primary" [routerLinkActiveOptions]="{exact: true}" class="text-700 hover:text-primary transition-colors transition-duration-200 cursor-pointer no-underline">新增文件</a>

    <div class="layout-main px-4 max-w-screen-xl mx-auto">
