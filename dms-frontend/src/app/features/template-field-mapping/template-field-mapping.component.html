<p-toast></p-toast>
<div class="card">
  <h2>欄位對應維護 (Template Field Mapping) - {{ templateCode }}</h2>
  
  <div class="mb-3">
    <p-button icon="pi pi-arrow-left" label="返回" (onClick)="goBack()" styleClass="p-button-secondary mr-2"></p-button>
    <p-button icon="pi pi-plus" label="新增 Mapping" (onClick)="showAddDialog()" styleClass="p-button-success"></p-button>
  </div>

  <p-table [value]="mappings" [tableStyle]="{ 'min-width': '50rem' }" [rows]="10" [paginator]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Sheet 名稱</th>
        <th>Header 標題名稱 (Excel)</th>
        <th>對應內部欄位名稱 (Mapping Field)</th>
        <th style="width: 10rem">操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-mapping>
      <tr>
        <td>{{ mapping.templateSheetName }}</td>
        <td>{{ mapping.headerName }}</td>
        <td>{{ mapping.mappingFieldName }}</td>
        <td>
          <p-button icon="pi pi-pencil" severity="info" (onClick)="showEditDialog(mapping)" pTooltip="編輯"></p-button>
          <p-button icon="pi pi-trash" severity="danger" class="ml-2" (onClick)="deleteMapping(mapping.id)" pTooltip="刪除"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- 新增/編輯 Dialog -->
<p-dialog [header]="isEditMode ? '編輯 Mapping' : '新增 Mapping'" [(visible)]="displayDialog" [modal]="true" [style]="{ width: '40vw' }">
  <form [formGroup]="mappingForm" class="p-fluid">
    <div class="field mb-3">
      <label for="templateSheetName">Sheet 名稱 (選填)</label>
      <input pInputText id="templateSheetName" formControlName="templateSheetName" placeholder="例如: HR" />
    </div>
    
    <div class="field mb-3">
      <label for="headerName">Header 標題名稱 (Excel) <span class="text-red-500">*</span></label>
      <input pInputText id="headerName" formControlName="headerName" placeholder="例如: 員工姓名" />
      <small class="p-error" *ngIf="mappingForm.get('headerName')?.invalid && mappingForm.get('headerName')?.touched">
        Header 標題名稱為必填
      </small>
    </div>
    
    <div class="field mb-3">
      <label for="mappingFieldName">內部欄位名稱 (Mapping Field) <span class="text-red-500">*</span></label>
      <input pInputText id="mappingFieldName" formControlName="mappingFieldName" placeholder="例如: NAME" />
      <small class="p-error" *ngIf="mappingForm.get('mappingFieldName')?.invalid && mappingForm.get('mappingFieldName')?.touched">
        對應內部欄位名稱為必填
      </small>
    </div>
  </form>
  
  <ng-template pTemplate="footer">
    <p-button icon="pi pi-times" label="取消" (onClick)="hideDialog()" styleClass="p-button-text"></p-button>
    <p-button icon="pi pi-check" label="儲存" (onClick)="saveMapping()"></p-button>
  </ng-template>
</p-dialog>
