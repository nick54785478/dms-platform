server:
  port: 8082

spring:
  application:
    name: template-service
    
  datasource:
    url: jdbc:postgresql://localhost:5432/file_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
