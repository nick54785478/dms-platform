spring.application.name=file-service
server.port=8081
# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/file_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis Configuration (Session/Cache)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=file_redis_pass
spring.session.store-type=redis

# ===============================
# Kafka Configuration (Event-Driven)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=file-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===============================
# MinIO / S3 Storage Configuration
# ===============================
file-service.storage.endpoint=http://localhost:9000
file-service.storage.access-key=minioadmin
file-service.storage.secret-key=minioadmin
file-service.storage.region=ap-northeast-1
file-service.storage.temp-bucket=file-service-temp
file-service.storage.permanent-bucket=file-service-permanent
